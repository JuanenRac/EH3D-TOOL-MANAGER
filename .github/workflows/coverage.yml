name: EH3D Coverage

on:
  push:
    branches: ["cov-before/**"]
    paths-ignore:
      - "**.md"
      - "images/**"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "images/**"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # the measured line coverage of the tests; it may be raised when the tests grow and never set above what is measured
  COVERAGE_FLOOR: "0"

jobs:
  rust:
    name: Coverage of the tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        shell: bash
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal --component llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked --version 0.6.16
      - name: Measure
        run: |
          cargo llvm-cov --all-targets --no-report
          cargo llvm-cov report --summary-only | tee summary.txt
          cargo llvm-cov report --show-missing-lines | tee missing.txt | tail -n 120
      - name: Line coverage stays at or above the floor
        run: |
          lines=$(awk '/^TOTAL/ {gsub("%","",$10); print $10}' summary.txt)
          echo "measured line coverage: ${lines}"
          awk -v m="$lines" -v f="$COVERAGE_FLOOR" 'BEGIN { exit !(m + 0 >= f + 0) }'
